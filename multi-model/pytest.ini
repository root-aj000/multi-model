[pytest]
# Pytest configuration for multi-model test suite

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Coverage options (optional, install pytest-cov)
# --cov=lib
# --cov=use_cases
# --cov=app
# --cov-report=html
# --cov-report=term-missing

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may need external services)
    slow: Slow running tests
    requires_gpu: Tests that require GPU
    requires_db: Tests that require database connection
    api: API endpoint tests
    model: Model architecture and forward pass tests
    preprocessing: Data preprocessing tests
    training: Training pipeline tests
    frontend: Frontend/UI tests
    e2e: End-to-end tests

# Minimum Python version
minversion = 3.8

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
